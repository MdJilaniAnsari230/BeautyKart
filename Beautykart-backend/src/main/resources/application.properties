# ---------------- Database ----------------
# Local default: MySQL on localhost. In production set DB_URL / DB_USERNAME / DB_PASSWORD.
# Aiven example (fill with YOUR values): jdbc:mysql://<HOST>:<PORT>/<DB>?sslMode=REQUIRED
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/beautyproject}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" only adds missing tables/columns. Never use create / create-drop.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

# ---------------- Uploads ----------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# NOTE: Render's disk is ephemeral; uploaded images are lost on redeploy/restart.
app.upload.profile-dir=${UPLOAD_DIR:uploads/profile-images}

# ---------------- Server ----------------
server.port=${PORT:8080}
# Render terminates TLS at its proxy; honour X-Forwarded-* headers.
server.forward-headers-strategy=framework

# ---------------- Session cookie ----------------
# Local HTTP development: lax + not secure (defaults).
# Production cross-site (Vercel -> Render): SESSION_COOKIE_SAME_SITE=none and SESSION_COOKIE_SECURE=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.http-only=true

# ---------------- CORS ----------------
# Comma-separated list of exact origins. No wildcard (credentials are used).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,https://beauty-kart-ashy.vercel.app}

# ---------------- Errors ----------------
server.error.include-stacktrace=never
server.error.include-message=never
